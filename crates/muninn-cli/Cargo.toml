[package]
name = "muninn-cli"
description = "The muninn command-line tool: catalog, CSV/NDJSON import, reads, ops, dump/restore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "muninn"
path = "src/main.rs"

[dependencies]
muninn-core.workspace = true
muninn-store.workspace = true
muninn-format.workspace = true
muninn-engine.workspace = true
crc32c.workspace = true
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env", "suggestions"] }
csv = "1.3"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
