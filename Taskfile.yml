version: '3'

tasks:
  test:
    desc: Run every Rust test (unit, property, store backends, scenario corpus)
    cmds:
      - cargo test --workspace

  lint:
    desc: Check formatting and run clippy with warnings as errors
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    desc: Format all Rust code
    cmds:
      - cargo fmt --all

  fuzz:
    desc: Long differential and crash/fault fuzzing of the engine (release build)
    env:
      MUNINN_FUZZ_CASES: '{{.CASES | default "5000"}}'
    cmds:
      - cargo test --release -p muninn-format
      - cargo test --release -p muninn-engine --test differential --test crash

  py-build:
    desc: Build the Python bindings (crates/muninn-py) into their uv venv
    dir: crates/muninn-py
    env:
      CARGO_BUILD_JOBS: '4'
    cmds:
      - uv sync
      - uv run maturin develop --uv --release

  py-test:
    desc: Build the Python bindings and run their tests (corpus, differential vs reference, API)
    dir: crates/muninn-py
    deps: [py-build]
    cmds:
      - uv run pytest {{.CLI_ARGS}}
